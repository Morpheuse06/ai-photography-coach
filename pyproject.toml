[project]
name = "ai-photography-coach"
version = "0.1.0"
description = "An AI photography coach that gives structured, actionable feedback."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.0,<2.0",
    "fastapi>=0.115,<1.0",
    "openai>=2.0,<3.0",
    "pillow>=11.0,<13.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "python-multipart>=0.0.18,<1.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
    "httpx2>=2.0,<3.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
